    tags: [yonyou]
  zhiyuan:
    tags: [zhiyuan, seeyon]
  weaver:
    tags: [weaver, cnvd]
  tongda:
    tags: [tongda, oa]
  kingdee:
    tags: [kingdee]
  lanlin:
    tags: [lanling]
  xinhu:
    tags: [xinhu, oa]
  wanhu:
    tags: [wanhu, oa]
  jeecg:
    tags: [jeecg]
