selectors:
  403bypass:
    consumes: {node_type: Endpoint}
    desc: "403 绕过 — 对受保护 HTTPEndpoint 执行并记录全部 TestAttempt"
    query: |
      MATCH (a:Asset {id: $asset_id})
      CALL (a) {
        WITH a
        MATCH (a)-[:HAS_DOMAIN]->(:Domain)-[:PARENT_OF*0..]->(:Domain)
              -[:RESOLVES_TO]->(:IP)-[:HAS_PORT]->(:Port)-[:EXPOSES]->(ep:HTTPEndpoint)
        RETURN ep
        UNION
        WITH a
        MATCH (a)-[:HAS_IP]->(:IP)-[:HAS_PORT]->(:Port)-[:EXPOSES]->(ep:HTTPEndpoint)
        RETURN ep
        UNION
        WITH a
        MATCH (a)-[:HAS_DOMAIN]->(:Domain)-[:PARENT_OF*0..]->(:Domain)-[:EXPOSES]->(ep:HTTPEndpoint)
        RETURN ep
      }
      WITH DISTINCT ep
      WHERE (ep.status_code = 403 OR 'protected' IN coalesce(ep.roles, []))
        AND NOT EXISTS { MATCH (sr:ScanRun) WHERE sr.tool = $tool AND sr.target = ep.url }
      RETURN ep.id AS id, ep.url AS url, coalesce(ep.fingerprint, []) AS tech
    mapping:
      url: '{url}'
      id: '{target_id}'
      tech: '{tech}'
    transform:
      tech: join_tech
