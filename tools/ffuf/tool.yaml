desc: "Web Fuzz 多模式"
command: "{bin} -u {url}/FUZZ -w {wordlist:web_dirs} -fc 403,404 -timeout 10 -t 50 -rate 10 {auth_headers} -json"
use_on:
  Endpoint:
    desc: "目录/路径 Fuzz"
    command: "{bin} -u {url}/FUZZ -w {wordlist:web_dirs} -fc 403,404 -timeout 10 -t 50 -rate 10 {auth_headers} -json"
    params:
      url: "{url}"
  IP:
    desc: "虚拟主机 Fuzz"
    command: "{bin} -u http://{ip} -H \"Host: FUZZ\" -w {wordlist:dns_subdomains} -fc 403,404 -json"
    params:
      ip: "{value}"
