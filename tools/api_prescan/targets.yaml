selectors:
  api_prescan:
    consumes: {node_type: Endpoint}
    desc: "API 预扫描 — 取 HTTPEndpoint 且未做过本工具扫描"
    query: |
      MATCH (a:Asset {id: $asset_id})
      CALL (a, a) {
        WITH a
        MATCH (a)-[:HAS_DOMAIN]->(:Domain)-[:PARENT_OF*0..]->(:Domain)-[:RESOLVES_TO]->(:IP)-[:HAS_PORT]->(:Port)-[:EXPOSES]->(ep:HTTPEndpoint)
        WHERE NOT EXISTS { MATCH (sr:ScanRun) WHERE sr.tool = $tool AND sr.target = ep.url AND ( $cooldown_hours <= 0 OR coalesce(sr.finished_at, '') < (datetime() - duration({hours: $cooldown_hours})) ) }
        RETURN ep
        UNION
        WITH a
        MATCH (a)-[:HAS_IP]->(:IP)-[:HAS_PORT]->(:Port)-[:EXPOSES]->(ep:HTTPEndpoint)
        WHERE NOT EXISTS { MATCH (sr:ScanRun) WHERE sr.tool = $tool AND sr.target = ep.url AND ( $cooldown_hours <= 0 OR coalesce(sr.finished_at, '') < (datetime() - duration({hours: $cooldown_hours})) ) }
        RETURN ep
      }
      WITH DISTINCT ep
      RETURN ep.url AS url
    mapping:
      url: "{url}"
