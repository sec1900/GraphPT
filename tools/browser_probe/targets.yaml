selectors:
  browser_probe:
    consumes: {node_type: Endpoint}
    desc: "浏览器探测 — 对首页/主要端点做 JS 渲染发现"
    query: |
      MATCH (a:Asset {id: $asset_id})
      CALL {
        MATCH (a)-[:HAS_DOMAIN]->(:Domain)-[:PARENT_OF*0..]->(:Domain)-[:RESOLVES_TO]->(:IP)-[:HAS_PORT]->(:Port)-[:EXPOSES]->(ep:HTTPEndpoint)
        RETURN ep
        UNION
        MATCH (a)-[:HAS_IP]->(:IP)-[:HAS_PORT]->(:Port)-[:EXPOSES]->(ep:HTTPEndpoint)
        RETURN ep
      }
      WITH DISTINCT ep
      WHERE ep.status_code = 200
        AND NOT EXISTS { MATCH (sr:ScanRun) WHERE sr.tool = $tool AND sr.target = ep.url AND ( $cooldown_hours <= 0 OR coalesce(sr.finished_at, '') < (datetime() - duration({hours: $cooldown_hours})) ) }
      RETURN ep.url AS url
    mapping:
      url: "{url}"
