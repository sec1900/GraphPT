selectors:
  cloud_metadata:
    consumes: {node_type: Vulnerability}
    desc: "SSRF 漏洞 — 自动探测云平台元数据端点"
    query: |
      MATCH (a:Asset {id: $asset_id})
      CALL (a, a) {
        MATCH (a)-[:HAS_DOMAIN]->(:Domain)-[:PARENT_OF*0..]->(:Domain)-[:RESOLVES_TO]->(:IP)-[:HAS_PORT]->(:Port)-[:EXPOSES]->(ep:HTTPEndpoint)-[:MAY_BE_VULNERABLE_TO]->(v:Vulnerability)
        RETURN v, ep.url AS endpoint_url, ep.id AS parent_id
        UNION
        MATCH (a)-[:HAS_IP]->(:IP)-[:HAS_PORT]->(:Port)-[:EXPOSES]->(ep:HTTPEndpoint)-[:MAY_BE_VULNERABLE_TO]->(v:Vulnerability)
        RETURN v, ep.url AS endpoint_url, ep.id AS parent_id
      }
      WITH DISTINCT v, endpoint_url, parent_id
      WHERE v.type IN ['ssrf', 'server-side-request-forgery']
        AND NOT EXISTS { MATCH (sr:ScanRun) WHERE sr.tool = $tool AND sr.target = v.id }
      RETURN v.id AS target_id, parent_id, endpoint_url AS url
    mapping:
      url: '{url}'
      parent_id: '{parent_id}'
