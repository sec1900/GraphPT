selectors:
  nuclei:
    consumes: {node_type: Endpoint}
    desc: 漏洞扫描 — 覆盖统一端点树（目录/API/页面）+ 分类闸门 + 指纹 tags 分流
    query: |
      MATCH (a:Asset {id: $asset_id})
      CALL (a, a) {
        MATCH (a)-[:HAS_DOMAIN]->(:Domain)-[:PARENT_OF*0..]->(:Domain)-[:RESOLVES_TO]->(:IP)-[:HAS_PORT]->(:Port)-[:EXPOSES]->(root:HTTPEndpoint)
        MATCH (root)-[:DISCOVERED*0..32]->(ep:HTTPEndpoint)
        WHERE ep.status_code > 0
          AND (ep.category IS NULL OR ep.category = '' OR ep.category IN ['page', 'api', 'cms', 'login', 'upload'])
        RETURN ep.url AS url, coalesce(ep.tech, []) AS tech, coalesce(ep.product, '') AS product
        UNION
        MATCH (a)-[:HAS_IP]->(:IP)-[:HAS_PORT]->(:Port)-[:EXPOSES]->(root:HTTPEndpoint)
        MATCH (root)-[:DISCOVERED*0..32]->(ep:HTTPEndpoint)
        WHERE ep.status_code > 0
          AND (ep.category IS NULL OR ep.category = '' OR ep.category IN ['page', 'api', 'cms', 'login', 'upload'])
        RETURN ep.url AS url, coalesce(ep.tech, []) AS tech, coalesce(ep.product, '') AS product
        UNION
        MATCH (a)-[:HAS_DOMAIN]->(:Domain)-[:PARENT_OF*0..]->(:Domain)-[:EXPOSES]->(root:HTTPEndpoint)
        MATCH (root)-[:DISCOVERED*0..32]->(ep:HTTPEndpoint)
        WHERE ep.status_code > 0
          AND (ep.category IS NULL OR ep.category = '' OR ep.category IN ['page', 'api', 'cms', 'login', 'upload'])
        RETURN ep.url AS url, coalesce(ep.tech, []) AS tech, coalesce(ep.product, '') AS product
      }
      WITH DISTINCT url, tech, product
      WHERE url IS NOT NULL AND url <> ''
        AND NOT EXISTS { MATCH (sr:ScanRun) WHERE sr.tool = $tool AND sr.target = url }
      RETURN url, tech, product
    mapping:
      url: "{urls_file}"
      tech: "{tech}"
      product: "{poc}"
    transform:
      tech: nuclei_tags
      poc: poc_tags
  nuclei:takeover:
    consumes:
      node_type: Domain
      domain_scope: all
    desc: "子域名接管检测 — 对所有子域名扫描 takeover 模板"
    query: |
      MATCH (a:Asset {id: $asset_id})-[:HAS_DOMAIN]->(:Domain)-[:PARENT_OF*0..]->(sub:Domain)
      WITH 'http://' + sub.value AS target
      WHERE NOT EXISTS { MATCH (sr:ScanRun) WHERE sr.tool = $tool AND sr.target = target }
      RETURN target
      UNION
      MATCH (a:Asset {id: $asset_id})-[:HAS_DOMAIN]->(:Domain)-[:PARENT_OF*0..]->(sub:Domain)
      WITH 'https://' + sub.value AS target
      WHERE NOT EXISTS { MATCH (sr:ScanRun) WHERE sr.tool = $tool AND sr.target = target }
      RETURN target
    mapping:
      target: "{urls_file}"
