desc: "漏洞扫描 — res/nuclei-templates/ + res/poc/ 全量模板（{tech} 指纹精准分流，空则盲扫兜底）"
command: "{bin} -list {urls_file} -jsonl -silent -rate-limit 100 -timeout 10 -retries 2 {tech} {poc} {oob_args} {auth_headers} {severity} -t res/nuclei-templates/ -t res/poc/ -irr"
use_on:
  Endpoint:
    desc: "对 Endpoint 执行漏洞扫描"
    params:
      urls_file: "{urls_file}"
    command: "{bin} -list {urls_file} -jsonl -silent -rate-limit 100 -timeout 10 -retries 2 {tech} {poc} {oob_args} {auth_headers} {severity} -t res/nuclei-templates/ -t res/poc/ -irr"
  Subdomain:
    desc: "对 Subdomain 执行子域名接管检测"
    params:
      urls_file: "{urls_file}"
    command: "{bin} -list {urls_file} -jsonl -silent -rate-limit 100 -timeout 10 -retries 1 -t res/nuclei-templates/http/takeovers/ -t res/nuclei-templates/dns/ -irr"
