selectors:
  dns_zonetransfer:
    consumes: {node_type: Domain, domain_scope: root}
    desc: "DNS 域传送 — 对 根 Domain 的 NS 服务器尝试 AXFR"
    query: |
      MATCH (a:Asset {id: $asset_id})-[:HAS_DOMAIN]->(rd:Domain)
      WHERE NOT EXISTS { MATCH (sr:ScanRun) WHERE sr.tool = $tool AND sr.target = rd.value }
      RETURN rd.value AS value
    mapping:
      value: '{domain}'
